server.port=8080
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=category-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://category-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/categories/**

spring.cloud.gateway.server.webmvc.routes[2].id=expense-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://expense-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/expenses/**

spring.cloud.gateway.server.webmvc.routes[3].id=report-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://report-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/reports/**